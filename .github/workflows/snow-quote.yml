name: Snow Quote

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 更新今日雪况一言
        run: node .github/scripts/quote.js
      - name: 提交变更
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 更新今日雪况一言'
          commit_user_name: 'Ameiro-sudo'
          commit_user_email: 'ninasukiwww@gmail.com'
          file_pattern: README.md
